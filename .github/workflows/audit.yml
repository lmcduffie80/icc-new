name: Security Audit

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    # Skip duplicate runs on PR from same repo
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scoped to production dependencies only. @better-auth/cli (a devDependency
      # used solely for local `db:migrate`/`db:generate` commands, never bundled
      # into the deployed app) pins an internal better-auth copy that lags behind
      # upstream security patches — no compatible CLI release exists yet. Auditing
      # --prod reflects the real, exploitable surface of the running application;
      # `pnpm audit --audit-level=high` (no --prod) can be run locally to check
      # the full dev+prod tree.
      - name: Audit production dependencies
        run: pnpm audit --audit-level=high --prod
